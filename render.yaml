services:
  - type: web
    name: local-keiba-analyzer
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_SOURCE
        value: mock
      # 本人専用モード（/real）の Basic 認証。値は Render ダッシュボードで設定し、Git には保存しない
      - key: REAL_AUTH_USER
        sync: false
      - key: REAL_AUTH_PASSWORD
        sync: false
      # 月次ファイルから作った近走データの保存先（Web のスリープをまたいで保持し、月次の取得を1日1回以下にする）
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: local-keiba-analyzer-kv
          property: connectionString
  - type: keyvalue
    name: local-keiba-analyzer-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: [] # 内部接続のみ
